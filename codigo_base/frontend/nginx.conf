server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        # Fallback de Single Page Application: si la ruta no corresponde a un
        # archivo o carpeta real, se entrega index.html y React decide qué
        # renderizar (evita 404 al recargar rutas del cliente).
        try_files $uri $uri/ /index.html;
    }

    # Opcional: cache agresiva para assets con hash de contenido (Vite).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
